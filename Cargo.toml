[package]
name = "skmob2"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "skmob2"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.28.2"
geo = "0.32.0"
rayon = "1.12"
wass = "0.2.0"
ndarray = "0.16"
ndarray015 = { package = "ndarray", version = "0.15" }
rand = "0.8"
linfa = "0.7"
linfa-clustering = "0.7"

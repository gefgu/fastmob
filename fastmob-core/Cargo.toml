[package]
name = "fastmob-core"
version = "0.2.0"
edition = "2024"
description = "Rust compute kernels for fastmob mobility analysis."
license = "BSD-3-Clause"
repository = "https://github.com/gefgu/fastmob"

[lib]
name = "fastmob_core"
crate-type = ["lib"]

[dependencies]
geo = "0.33.0"
chrono = "0.4"
h3o = "0.10"
rayon = "1.12"
ndarray = "0.16"
ndarray015 = { package = "ndarray", version = "0.15" }
rand = "0.8"
rand_xoshiro = "0.6"
moka = { version = "0.12.15", default-features = false, features = ["sync"] }
linfa = "0.7"
linfa-clustering = "0.7"
linfa-nn = "0.7.1"
numkong = { version = "7.6.0", optional = true }
rustc-hash = "2.1.1"
fast_paths = "1"

[dev-dependencies]
# Only used as the differential-testing reference for stvd_emd's sparse
# candidate-graph Sinkhorn (see stvd_emd.rs::dense_reference_impl) -- the
# production path no longer depends on it, so it's not linked into release
# builds at all.
wass = "0.2.0"

[features]
# Keep the historical `simd` default as an alias for the native accelerated
# crates. CI wheel builds can enable `stvd-emd` without `numkong` to avoid
# numkong's manylinux/musllinux cross-build issues.
default = ["simd"]
simd = ["numkong", "stvd-emd"]
numkong = ["dep:numkong"]
# No longer enables an optional dependency (wass moved to dev-dependencies,
# see above) -- kept as a feature purely to gate compilation of the
# stvd_emd/stvd_candidate_graph/stvd_sparse_sinkhorn modules, since
# fastmob-py/Cargo.toml and CI/wheel scripts key off this feature name.
stvd-emd = []

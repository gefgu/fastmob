<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Noisy GPS points snapped onto a road line" font-family="Inter, system-ui, sans-serif">
  <style>
    .road { stroke: #9a9a9a; stroke-width: 10; fill: none; stroke-linecap: round; }
    .route { stroke: #c9a400; stroke-width: 5; fill: none; stroke-linecap: round; }
    .pt { fill: #d9534f; }
    .t { fill: #777; font-size: 20px; font-weight: 600; }
  </style>
  <path class="road" d="M40 280 C 200 280, 220 90, 380 90 S 560 200, 600 200"/>
  <path class="road" d="M200 330 L200 200"/>
  <path class="route" d="M40 280 C 200 280, 220 90, 380 90 S 560 200, 600 200"/>
  <g class="pt"><circle cx="60" cy="262" r="6"/><circle cx="120" cy="296" r="6"/><circle cx="190" cy="250" r="6"/><circle cx="235" cy="170" r="6"/><circle cx="290" cy="64" r="6"/><circle cx="370" cy="118" r="6"/><circle cx="450" cy="100" r="6"/><circle cx="520" cy="215" r="6"/><circle cx="585" cy="180" r="6"/></g>
  <text class="t" x="40" y="40">raw GPS (red) snapped to the road (gold)</text>
</svg>

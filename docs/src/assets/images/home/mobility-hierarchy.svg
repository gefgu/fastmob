<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
  <title id="t">fastmob mobility hierarchy</title>
  <desc id="d">Position fixes become staypoints and triplegs, which combine into trips and then tours.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <g fill="#faff69" stroke="#b8b300" stroke-width="1.5">
    <rect x="8" y="55" width="140" height="64" rx="10"/>
    <rect x="188" y="20" width="140" height="64" rx="10"/>
    <rect x="188" y="90" width="140" height="64" rx="10"/>
    <rect x="388" y="55" width="140" height="64" rx="10"/>
    <rect x="568" y="55" width="140" height="64" rx="10"/>
    <rect x="748" y="55" width="124" height="64" rx="10"/>
  </g>
  <g fill="#111" text-anchor="middle" font-size="15" font-weight="700">
    <text x="78" y="84">Positionfixes</text>
    <text x="258" y="49">Staypoints</text>
    <text x="258" y="119">Triplegs</text>
    <text x="458" y="84">Trips</text>
    <text x="638" y="84">Tours</text>
    <text x="810" y="84">Locations</text>
  </g>
  <g fill="#333" text-anchor="middle" font-size="11.5">
    <text x="78" y="103">raw GPS / check-ins</text>
    <text x="258" y="68">where you stopped</text>
    <text x="258" y="138">movement between</text>
    <text x="458" y="103">stop-to-stop journeys</text>
    <text x="638" y="103">trips back to a place</text>
    <text x="810" y="103">recurring places</text>
  </g>
  <g stroke="#8a8a8a" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M148 80 L186 55"/>
    <path d="M148 94 L186 119"/>
    <path d="M328 55 L386 80"/>
    <path d="M328 119 L386 94"/>
    <path d="M528 87 L566 87"/>
    <path d="M708 87 L746 87"/>
  </g>
  <text x="440" y="185" text-anchor="middle" font-size="12" fill="#8a8a8a">One method per stage: generate_staypoints(), generate_triplegs(), generate_trips(), generate_tours()</text>
</svg>

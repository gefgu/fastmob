<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Fastkit-Mobility module map</title>
  <desc id="desc">Raw points flow through data structures and preprocessing, then trajectory, network and integration, then measures, fitting and models, then evaluation, privacy and visualization.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#879097"/></marker>
    <style>
      .node { fill:#f6f4eb; stroke:#c5aa28; stroke-width:2; }
      .input { fill:#f0df91; stroke:#aa9000; stroke-width:2; }
      .label { fill:#343b40; font-family:DejaVu Sans,sans-serif; font-size:19px; font-weight:600; text-anchor:middle; dominant-baseline:middle; }
      .line { fill:none; stroke:#879097; stroke-width:2.3; }
      @media(prefers-color-scheme:dark) { .node {fill:#34393c;stroke:#d8bd45}.input{fill:#554c28;stroke:#e2cb64}.label{fill:#f2f0e8}.line{stroke:#a5adb2}.arrow{fill:#a5adb2} }
    </style>
  </defs>

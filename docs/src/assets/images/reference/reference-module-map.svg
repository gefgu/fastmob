    <path d="M495 106 505 112 495 118ZM495 229 505 235 495 241ZM495 352 505 358 495 364Z"/>
    <path d="M745 106 755 112 745 118ZM745 229 755 235 745 241ZM745 352 755 358 745 364Z"/>
    <path d="M995 106 1005 112 995 118ZM995 229 1005 235 995 241ZM995 352 1005 358 995 364Z"/>

[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "fastmob-vis"
version = "0.1.0"
description = "High-performance ECharts visualization for fastmob mobility-analysis results"
readme = "README.md"
requires-python = ">=3.8"
license = "BSD-3-Clause"
authors = [
    { name = "Gustavo Henrique Bruno dos Santos" },
]
dependencies = [
    "numpy>=1.23",
    "fastmob",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/gefgu/fastmob"
Repository = "https://github.com/gefgu/fastmob"
Issues = "https://github.com/gefgu/fastmob/issues"

[project.optional-dependencies]
legacy = [
    "folium",
    "geopandas",
    "geojson",
    "matplotlib",
    "pandas",
    "shapely",
]
dev = [
    "folium",
    "geopandas",
    "geojson",
    "matplotlib",
    "maturin>=1.13,<2.0",
    "pandas",
    "pytest",
    "ruff",
    "shapely",
]

[tool.maturin]
module-name = "fastmob_vis._core"
python-source = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py38"
line-length = 120
src = ["fastmob_vis", "tests", "examples"]

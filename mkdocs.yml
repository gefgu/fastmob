site_name: skmob2
site_description: High-performance mobility analysis library with a Rust-accelerated core and backend-agnostic DataFrame API.
site_url: https://gefgu.github.io/skmob2/
repo_url: https://github.com/gefgu/skmob2
repo_name: gefgu/skmob2

docs_dir: docs/src

theme:
  name: material
  font:
    text: Inter
    code: Fira Code
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: false
            show_symbol_type_toc: false

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference:
    - Overview: api/index.md
    - Preprocessing: api/preprocessing.md
    - Spatial Measures: api/spatial.md
    - Flow Measures: api/flows.md
    - Visit Measures: api/visits.md
    - Fitting: api/fitting.md
    - Evaluation: api/evaluation.md
    - STVD-EMD: api/stvd-emd.md

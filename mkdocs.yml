site_name: skmob2
site_description: High-performance mobility analysis library with a Rust-accelerated core and backend-agnostic DataFrame API.
site_url: https://gefgu.github.io/skmob2/
repo_url: https://github.com/gefgu/skmob2
repo_name: gefgu/skmob2

docs_dir: docs/src

# Use the documentation assets folder for site branding (Material theme keys)

theme:
  # Logo and favicon paths are relative to `docs_dir`
  logo: assets/logo.png
  favicon: assets/icon.png
  name: material
  font:
    text: Inter
    code: Fira Code
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: false
            show_symbol_type_toc: false

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tutorials:
    - Overview: tutorials/index.md
    - Analyze a Simple Trajectory: tutorials/analyze-a-simple-trajectory.md
  - How-To Guides:
    - Overview: how-to-guides/index.md
    - Use Custom Columns and DataFrame Backends: how-to-guides/use-custom-columns-and-dataframe-backends.md
  - Explanations:
    - Overview: explanations/index.md
    - Backend-Agnostic, Rust-Accelerated Design: explanations/backend-agnostic-rust-accelerated-design.md
    - Correctness, Coverage, and Benchmarking: explanations/correctness-coverage-and-benchmarking.md
  - API Reference:
    - Overview: api/index.md
    - Preprocessing: api/preprocessing.md
    - Spatial Measures: api/spatial.md
    - Flow Measures: api/flows.md
    - Visit Measures: api/visits.md
    - Fitting: api/fitting.md
    - Evaluation: api/evaluation.md
    - STVD-EMD: api/stvd-emd.md

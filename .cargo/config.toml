[env]
NK_TARGET_SAPPHIRE = { value = "0", force = false }
NK_TARGET_SAPPHIREAMX = { value = "0", force = false }
NK_TARGET_GRANITEAMX = { value = "0", force = false }
NK_TARGET_DIAMOND = { value = "0", force = false }
NK_TARGET_TURIN = { value = "0", force = false }
NK_TARGET_SIERRA = { value = "0", force = false }


[build]
# Release wheels must run on any CPU of their platform and must cross-compile, so no
# target-cpu=native here. For local benchmarks use: RUSTFLAGS="-C target-cpu=native".
# rustflags = ["-C", "force-frame-pointers=yes", "-C", "symbol-mangling-version=v0"]

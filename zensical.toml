[project]
site_name = "Fastkit-Mobility"
site_description = "High-performance mobility analysis library with a Rust-accelerated core and backend-agnostic DataFrame API."
site_url = "https://gefgu.github.io/fastmob/"
repo_url = "https://github.com/gefgu/fastmob"
repo_name = "gefgu/fastmob"
docs_dir = "docs/src"
copyright = "Fastkit-Mobility 0.3.4 &middot; BSD-3-Clause licensed &middot; <a href=\"https://pypi.org/project/fastmob/\">PyPI</a> &middot; <a href=\"https://github.com/gefgu/fastmob\">GitHub</a>"
extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

nav = [
  { "Home" = "index.md" },
  { "Features" = [
    { "Features overview" = "features/index.md" },
    { "Benchmarks" = "features/benchmarks.md" },
    { "Optimizations" = "features/optimizations.md" },
  ] },
  { "Learn" = [
    { "Learn overview" = "learn/index.md" },
    { "1. Getting started" = [
      { "Start with a trajectory" = "learn/analyze-a-simple-trajectory.md" },
      { "Use your own columns and dataframe library" = "learn/use-custom-columns-and-dataframe-backends.md" },
    ] },
    { "2. Preparing trajectories" = [
      { "Cleaning and segmentation" = "learn/clean-and-segment.md" },
      { "Clean noisy GPS data and find stops" = "learn/clean-and-detect-stops.md" },
      { "Fill gaps, smooth, compare and convert trajectories" = "learn/process-trajectories.md" },
      { "Stops and locations" = "learn/staypoints-and-locations.md" },
      { "Build the trajectory hierarchy: stops, trips and tours" = "learn/trajectory-hierarchy.md" },
    ] },
    { "3. Measuring mobility" = [
      { "Measuring people and populations" = "learn/individual-and-collective-measures.md" },
      { "Measure individual mobility" = "learn/measure-individual-mobility.md" },
      { "Routine, predictability and mobility profiles" = "learn/visit-based-measures.md" },
      { "Find daily mobility motifs" = "learn/motifs.md" },
      { "Population measures" = "learn/population-measures.md" },
      { "Flows between places" = "learn/flows-between-places.md" },
      { "Occupancy and phone records" = "learn/occupancy-and-phone-records.md" },
    ] },
    { "4. Spatial and network analysis" = [
      { "Roads, rails and map matching" = "learn/network-analysis.md" },
      { "Road networks: matching, routing and route flows" = "learn/road-network-analysis.md" },
      { "Contact networks from stays" = "learn/contact-networks.md" },
    ] },
    { "5. Modelling, evaluating and protecting" = [
      { "Compare your data to mobility laws" = "learn/compare-to-mobility-laws.md" },
      { "Generate mobility with models" = "learn/generate-mobility.md" },
      { "Fit and compare distributions" = "learn/fit-and-evaluate.md" },
      { "Privacy risk of trajectories" = "learn/privacy-risk.md" },
    ] },
    { "6. Charting results" = [
      { "Chart your results" = "learn/visualize-results.md" },
    ] },
  ] },
  { "Reference" = [
    { "Reference overview" = "reference/index.md" },
    { "Data structures" = [
      { "Data structures overview" = "reference/data-structures.md" },
      { "TrajDataFrame" = "reference/data-structures/traj-dataframe.md" },
      { "Positionfixes" = "reference/data-structures/positionfixes.md" },
      { "Staypoints" = "reference/data-structures/staypoints.md" },
      { "Locations" = "reference/data-structures/locations.md" },
      { "Triplegs" = "reference/data-structures/triplegs.md" },
      { "Trips" = "reference/data-structures/trips.md" },
      { "Tours" = "reference/data-structures/tours.md" },
      { "FlowDataFrame" = "reference/data-structures/flow-dataframe.md" },
      { "BaseDataFrame" = "reference/data-structures/base-dataframe.md" },
    ] },
    { "Preprocessing" = "reference/preprocessing.md" },
    { "Trajectory" = "reference/trajectory.md" },
    { "Tessellation" = "reference/tessellation.md" },
    { "Network" = "reference/network.md" },
    { "Integration" = "reference/integration.md" },
    { "Measures" = [
      { "Measures overview" = "reference/measures/index.md" },
      { "Individual" = "reference/measures/individual.md" },
      { "Collective" = "reference/measures/collective.md" },
      { "Contact network" = "reference/measures/contact-network.md" },
      { "Evaluation" = "reference/measures/evaluation.md" },
    ] },
    { "Fitting" = "reference/fitting.md" },
    { "Models" = "reference/models.md" },
    { "Input/output" = "reference/io.md" },
    { "Privacy" = "reference/privacy.md" },
    { "Data" = "reference/data.md" },
    { "Visualization" = "reference/visualization.md" },
  ] },
  { "About" = [
    { "About Fastkit-Mobility" = "about/index.md" },
    { "Resources" = "resource/index.md" },
    { "Development setup" = "about/development.md" },
    { "Release notes" = "release_notes/index.md" },
  ] },
]

[project.theme]
custom_dir = "docs/overrides"
logo = "assets/logo_header.svg"
favicon = "assets/icon.svg"
variant = "modern"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "yellow"

[project.theme.palette.toggle]
icon = "lucide/moon"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "yellow"

[project.theme.palette.toggle]
icon = "lucide/sun"
name = "Switch to light mode"

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_source = false
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = false
show_symbol_type_toc = false

[project.markdown_extensions.admonition]

[project.markdown_extensions."docs.extensions.rst_math"]

[project.markdown_extensions."pymdownx.arithmatex"]
generic = true

[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.superfences"]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions."pymdownx.inlinehilite"]

[project.markdown_extensions."pymdownx.snippets"]

[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "skmob2"
requires-python = ">=3.8"
dependencies = [
    "narwhals>=1.0",
    "pandas>=1.5",
    "simsimd>=5.3",
]

classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[project.optional-dependencies]
ai = ["scikit-learn>=1.3.2"]
fitting = ["scipy"]
diversity = ["pydivsufsort"]
generation = ["scipy", "powerlaw", "statsmodels", "python-igraph", "tqdm"]
data = ["geopandas", "shapely", "pyproj", "requests"]
tessellation = ["geopandas", "shapely", "pyproj", "h3", "requests"]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pyarrow",
    "polars",
    "ruff",
    "scalene",
    "scikit-learn>=1.3.2",
    "tqdm",
    "scipy",
    "powerlaw",
    "statsmodels",
    "python-igraph",
    "pydivsufsort",
    "geopandas",
    "shapely",
    "pyproj",
    "h3",
    "requests",
]
dev-skmob = [
    "fiona",
    "scikit-mobility",
]
dev-movingpandas = [
    "movingpandas",
    "geopandas",
]
docs = [
    "zensical>=0.0.41; python_version >= '3.10'",
    "mkdocstrings[python]>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["skmob2"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py38"
line-length = 120
src = ["skmob2", "scripts", "tests", "benchmarks"]
extend-exclude = ["benchmarks/*.ipynb"]

[tool.maturin]
module-name = "skmob2._core"
python-source = "."

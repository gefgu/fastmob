[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "fastmob"
description = "High-performance mobility analysis with a Rust-accelerated core and backend-agnostic DataFrame API."
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [
    { name = "Gustavo Henrique Bruno dos Santos" },
]
dependencies = [
    "narwhals>=1.0",
    "pandas>=1.5",
    "pyarrow>=14",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/gefgu/fastmob"
Documentation = "https://gefgu.github.io/fastmob/"
Repository = "https://github.com/gefgu/fastmob"
Issues = "https://github.com/gefgu/fastmob/issues"

[project.optional-dependencies]
ai = ["scikit-learn>=1.3.2"]
fitting = ["scipy"]
generation = ["scipy", "powerlaw", "statsmodels", "python-igraph", "tqdm"]
data = ["geopandas", "shapely", "pyproj", "requests"]
tessellation = ["geopandas", "shapely", "pyproj", "h3", "requests"]
# Road/rail network fetch+snap also needs `ai` (scikit-learn, for
# snap_locations_to_graph's NearestNeighbors) -- install both extras.
network = ["duckdb", "requests"]
# `vis` is the separate fastmob-vis package, which also owns the legacy
# Folium/Matplotlib visualizations.
vis = ["fastmob-vis[legacy]"]
dev = [
    "pre-commit",
    "maturin>=1.13,<2.0",
    "pytest",
    "pytest-cov",
    "pyarrow",
    "polars",
    "ruff",
    "scalene",
    "memray",
    "scikit-learn>=1.3.2",
    "tqdm",
    "scipy",
    "powerlaw",
    "statsmodels",
    "python-igraph",
    "geopandas",
    "shapely",
    "pyproj",
    "h3",
    "requests",
    "psutil",
    "similaritymeasures",
]
dev-skmob = [
    "fiona",
    "h3",
    "scikit-mobility",
]
dev-movingpandas = [
    "movingpandas",
    "geopandas",
]
dev-ptrail = [
    "ptrail",
    "ipython<8",
    # PTRAIL 1.0's Filters.hampel_outlier_detection uses the `hampel` package's
    # return value directly as a list of outlier indices, which only works
    # with hampel<1.0 (hampel>=1.0 returns a Result namedtuple instead and
    # crashes that call with an IndexError). Pin to a version PTRAIL's own
    # "hampel>=0.0.5" requirement already allows.
    "hampel==0.0.5",
    "pyarrow",
]
dev-transbigdata = [
    "transbigdata",
    # traj_mapmatch takes "a networkx multidigraph, created by osmnx" --
    # osmnx/networkx are only ever used inside this comparison test harness
    # to build that input graph, never by fastmob's own code.
    "networkx",
    "osmnx",
]
# TransBigData's own pinned stack (geopandas/shapely/pandas/numpy/networkx/
# osmnx) is individually compatible with this project's normal .venv, but
# installing it via `uv pip install -e ".[dev-transbigdata]"` into an
# *already-populated* .venv can still trigger a full dependency
# re-resolution -- transbigdata pulls in pykalman (which allows
# numpy<3 but also ships a numpy<2 "numpy1" extra) and scikit-base, and uv
# resolving the whole project + this extra together landed on numpy 1.26
# instead of the numpy>=2 already installed, silently breaking unrelated
# fastmob code compiled/tested against numpy 2.x. A dedicated venv, resolved
# from scratch, does not hit this: bash scripts/setup_env.sh --venv
# .venv-transbigdata --transbigdata. Never install dev-transbigdata into an
# existing .venv in place.
dev-pymove = [
    "pymove",
    # pymove 3.0.0's own metadata just says "pandas>=1.1.0" (no upper
    # bound), so uv resolves it against this project's own "pandas>=1.5"
    # base dependency without complaint -- but pymove's actual *code*
    # (pymove/utils/trajectories.py) imports `pandas._typing.FilePathOrBuffer`,
    # which pandas removed in 1.4. A real "pandas<1.4" pin here would
    # directly conflict with the base "pandas>=1.5" dependency at resolve
    # time, so it can't be expressed as an extra; scripts/setup_env.sh's
    # --pymove branch force-reinstalls pandas (and a matching old dask,
    # whose newer releases refuse to import under pandas<2.0) as a separate
    # step after this extra installs. numpy must also be re-pinned: uv
    # otherwise resolves numpy>=2, which pandas 1.3.x's compiled ABI can't
    # load. See fastmob_benchmarks/pymove's README "Known issues" for the
    # original failure mode. Needs Python <=3.10 (no prebuilt pandas 1.3.5
    # wheel past that) and a dedicated .venv-pymove:
    #   bash scripts/setup_env.sh --venv .venv-pymove --python 3.9 --pymove
    "numpy>=1.23,<2",
]
docs = [
    "zensical>=0.0.41; python_version >= '3.10'",
    "mkdocstrings[python]>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["fastmob"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["fastmob", "scripts", "tests", "benchmarks"]
extend-exclude = ["benchmarks/*.ipynb"]

[tool.maturin]
module-name = "fastmob._core"
python-source = "."
manifest-path = "fastmob-py/Cargo.toml"

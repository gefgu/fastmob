[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "fastmob"
description = "High-performance mobility analysis with a Rust-accelerated core and backend-agnostic DataFrame API."
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [
    { name = "Gustavo Henrique Bruno dos Santos" },
]
dependencies = [
    "narwhals>=1.0",
    "numpy",
    "pyarrow>=14",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/gefgu/fastmob"
Documentation = "https://gefgu.github.io/fastmob/"
Repository = "https://github.com/gefgu/fastmob"
Issues = "https://github.com/gefgu/fastmob/issues"

[project.optional-dependencies]
# Public extras are organised around user-facing capabilities. Development,
# documentation, and third-party comparison stacks live in dependency groups or
# dedicated benchmark environments below; they are intentionally not published
# as installable package extras.
geo = ["geopandas", "shapely", "pyproj"]
# `vis` is the separate ECharts/Leaflet visualization package.
vis = ["fastmob-vis"]

[dependency-groups]
dev = [
    "pre-commit",
    "maturin>=1.13,<2.0",
    "pytest",
    "pytest-cov",
    "pyarrow",
    "polars",
    "pandas",
    "modin[dask]",
    "dask[dataframe]",
    "duckdb",
    "ruff",
    "scalene",
    "memray",
    "scikit-learn>=1.3.2",
    "scipy",
    "statsmodels",
    "geopandas",
    "shapely",
    "pyproj",
    "psutil",
    "similaritymeasures",
]
docs = [
    "zensical>=0.0.41; python_version >= '3.10'",
    "mkdocstrings[python]>=0.25",
    "nbconvert>=7.0",
]

[tool.uv.sources]
fastmob-vis = { path = "fastmob-vis" }

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["fastmob"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["fastmob", "scripts", "tests", "benchmarks"]
extend-exclude = ["benchmarks/*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# These scripts intentionally modify sys.path before importing benchmark-only
# and optional third-party dependencies.
"benchmarks/*.py" = ["E402"]
"benchmarks/**/*.py" = ["E402"]
"tests/correctness/models/test_large_scale_parity.py" = ["E402"]
"tests/correctness/tessellation/test_tilers.py" = ["E402"]
"tests/populate_*.py" = ["E402"]

[tool.maturin]
module-name = "fastmob._core"
python-source = "."
manifest-path = "fastmob-py/Cargo.toml"

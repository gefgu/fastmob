[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "skmob2"
requires-python = ">=3.8"
dependencies = [
    "narwhals>=1.0",
    "pandas>=1.5",
    "scikit-learn>=1.3.2",
]

classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[project.optional-dependencies]
fitting = ["scipy"]
diversity = ["pydivsufsort"]
dev = [
    "pytest",
    "pytest-benchmark",
    "polars",
    "tqdm",
    "scipy",
    "pydivsufsort",
]
dev-skmob = [
    "scikit-mobility",
]
dev-movingpandas = [
    "movingpandas",
    "geopandas",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]

[tool.maturin]
module-name = "skmob2._core"
python-source = "."


[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "fastmob"
description = "High-performance mobility analysis with a Rust-accelerated core and backend-agnostic DataFrame API."
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [
    { name = "Gustavo Henrique Bruno dos Santos" },
]
dependencies = [
    "narwhals>=1.0",
    "pandas>=1.5",
    "simsimd>=5.3",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/gefgu/fastmob"
Documentation = "https://gefgu.github.io/fastmob/"
Repository = "https://github.com/gefgu/fastmob"
Issues = "https://github.com/gefgu/fastmob/issues"

[project.optional-dependencies]
ai = ["scikit-learn>=1.3.2"]
fitting = ["scipy"]
diversity = ["pydivsufsort"]
generation = ["scipy", "powerlaw", "statsmodels", "python-igraph", "tqdm"]
data = ["geopandas", "shapely", "pyproj", "requests"]
tessellation = ["geopandas", "shapely", "pyproj", "h3", "requests"]
# Road/rail network fetch+snap also needs `ai` (scikit-learn, for
# snap_locations_to_graph's NearestNeighbors) -- install both extras.
network = ["duckdb", "requests"]
visualization = ["folium", "matplotlib", "geojson"]
dev = [
    "pre-commit",
    "maturin>=1.13,<2.0",
    "pytest",
    "pytest-cov",
    "pyarrow",
    "polars",
    "ruff",
    "scalene",
    "memray",
    "scikit-learn>=1.3.2",
    "tqdm",
    "scipy",
    "powerlaw",
    "statsmodels",
    "python-igraph",
    "pydivsufsort",
    "geopandas",
    "shapely",
    "pyproj",
    "h3",
    "requests",
    "psutil",
    "similaritymeasures",
]
dev-skmob = [
    "fiona",
    "scikit-mobility",
]
dev-movingpandas = [
    "movingpandas",
    "geopandas",
]
dev-ptrail = [
    "ptrail",
    "ipython<8",
    # PTRAIL 1.0's Filters.hampel_outlier_detection uses the `hampel` package's
    # return value directly as a list of outlier indices, which only works
    # with hampel<1.0 (hampel>=1.0 returns a Result namedtuple instead and
    # crashes that call with an IndexError). Pin to a version PTRAIL's own
    # "hampel>=0.0.5" requirement already allows.
    "hampel==0.0.5",
    "pyarrow",
]
docs = [
    "zensical>=0.0.41; python_version >= '3.10'",
    "mkdocstrings[python]>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["fastmob"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["fastmob", "scripts", "tests", "benchmarks"]
extend-exclude = ["benchmarks/*.ipynb"]

[tool.maturin]
module-name = "fastmob._core"
python-source = "."
manifest-path = "fastmob-py/Cargo.toml"
